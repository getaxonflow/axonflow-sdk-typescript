name: Wire-Shape Contract

# QF-15 TypeScript arm: blocks drift between exported TS interfaces
# and the OpenAPI specs that are the authoritative wire contract.
# Runs on every PR and push to main. Drift NOT covered by the baseline
# fails the check.
#
# Specs are a schema snapshot committed under tests/fixtures/openapi/
# (see its README), derived from the platform's docs/api at the commit
# recorded as openapi_specs_sha in tests/fixtures/wire-shape-baseline.json
# by scripts/snapshot_openapi_schemas.py, so the gate is deterministic. A
# 'spec-pin-bump' label is required on PRs that change the SHA OR any file
# under tests/fixtures/openapi/, preserving review integrity (a PR that
# moved the pin and the TS types together could otherwise silence drift).
#
# To regenerate the baseline:
#   node scripts/wire-shape/refresh.js <specs_dir>

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**/*.ts'
      - 'tests/fixtures/wire-shape-baseline.json'
      - 'tests/fixtures/audit-binding-spec.json'
      - 'scripts/wire-shape/**'
      - 'scripts/audit-binding/**'
      - 'scripts/snapshot_openapi_schemas.py'
      - 'tests/fixtures/openapi/**'
      - '.github/workflows/wire-shape-contract.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'src/**/*.ts'
      - 'tests/fixtures/wire-shape-baseline.json'
      - 'tests/fixtures/audit-binding-spec.json'
      - 'scripts/wire-shape/**'
      - 'scripts/audit-binding/**'
      - 'scripts/snapshot_openapi_schemas.py'
      - 'tests/fixtures/openapi/**'
      - '.github/workflows/wire-shape-contract.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wire-shape:
    name: Validate Wire Shape
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK (full history for SHA-bump guard)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read pinned OpenAPI specs SHA from baseline
        id: specs_sha
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys
          path = "tests/fixtures/wire-shape-baseline.json"
          data = json.load(open(path))
          sha = (data.get("openapi_specs_sha", "") or "").strip()
          if not sha:
              print(
                  f"::error::{path} is missing openapi_specs_sha. "
                  "Regenerate via scripts/wire-shape/refresh.js.",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"sha={sha}")
          PY

      - name: Guard against unauthorized OpenAPI specs SHA bump
        if: github.event_name == 'pull_request'
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_REF: ${{ github.base_ref }}
          PR_SHA: ${{ steps.specs_sha.outputs.sha }}
        run: |
          set -e
          BASE_SHA=$(
            git show "origin/${BASE_REF}:tests/fixtures/wire-shape-baseline.json" 2>/dev/null \
              | python3 -c "import json, sys; print(json.load(sys.stdin).get('openapi_specs_sha','') or '')" \
              || true
          )
          if [ -z "$BASE_SHA" ]; then
            echo "::notice::Base branch has no openapi_specs_sha yet; treating this PR as first pin introduction."
            exit 0
          fi
          SNAPSHOT_CHANGED=false
          if ! git diff --quiet "origin/${BASE_REF}...HEAD" -- tests/fixtures/openapi/; then
            SNAPSHOT_CHANGED=true
          fi
          if [ "$BASE_SHA" = "$PR_SHA" ] && [ "$SNAPSHOT_CHANGED" = false ]; then
            echo "openapi_specs_sha unchanged (${PR_SHA}) and tests/fixtures/openapi/ unchanged."
            exit 0
          fi
          echo "Pin change detected: openapi_specs_sha ${BASE_SHA} -> ${PR_SHA}; snapshot changed: ${SNAPSHOT_CHANGED}"
          HAS_LABEL=$(printf '%s' "$PR_LABELS" | python3 -c "import json, sys; print('spec-pin-bump' in json.load(sys.stdin))")
          if [ "$HAS_LABEL" = "True" ]; then
            echo "::notice::'spec-pin-bump' label present — SHA bump authorized."
            exit 0
          fi
          if [ "$BASE_SHA" != "$PR_SHA" ]; then
            echo "::error::openapi_specs_sha changed from ${BASE_SHA} to ${PR_SHA}."
          fi
          if [ "$SNAPSHOT_CHANGED" = true ]; then
            echo "::error::tests/fixtures/openapi/ changed; the spec snapshot is part of the pin."
          fi
          echo "::error::The wire-shape contract's spec revision is pinned to preserve"
          echo "::error::review integrity: a SHA change in the same PR as SDK changes"
          echo "::error::can silence drift by retargeting the contract to a friendlier"
          echo "::error::revision. Either split into a dedicated SHA-bump PR, or"
          echo "::error::apply the 'spec-pin-bump' label to this PR."
          exit 1

      - name: Set up Python (spec snapshot checks)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check the committed spec snapshot
        # The derivation's own self-test, then the committed snapshot must be
        # exactly the script's derived form (prose, types or a spec copied in
        # verbatim are refused). Any change to it also needs the label above.
        run: |
          python -m pip install --quiet pyyaml
          python scripts/snapshot_openapi_schemas.py --self-test
          python scripts/snapshot_openapi_schemas.py --check-snapshot tests/fixtures/openapi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run wire-shape contract validator
        env:
          AXONFLOW_OPENAPI_SPECS_DIR: ${{ github.workspace }}/tests/fixtures/openapi
        run: node scripts/wire-shape/validate.js

      - name: Run audit-surface binding gate (#3254)
        # Unlike the recording wire-shape baseline, this gate BINDS the
        # audit model to the pinned spec: every wire field the model
        # declares (via its transformer mapping in client.ts) must exist
        # in the OpenAPI schema; unresolvable bindings FAIL rather than
        # skip. The seven deprecated fiction fields + request_type are
        # carried as curated, noted debt. The vendored fixture keeps the
        # gate running without this env var; setting it here additionally
        # cross-checks the fixture against the pinned spec snapshot.
        env:
          AXONFLOW_OPENAPI_SPECS_DIR: ${{ github.workspace }}/tests/fixtures/openapi
        run: node scripts/audit-binding/check.js

      - name: Run transformer-coverage gate (type-vs-implementation)
        # Catches the class of bug where a typed wire field exists on
        # the interface but the runtime transformer's return literal
        # doesn't populate it (cancelPlan.success, mapBudgetResponse
        # missing tenant_id/org_id, listUsageRecords missing 8 wire
        # fields — every gap caught by the post-merge audit on PR
        # #185 would have been blocked by this gate at PR time).
        run: node scripts/transformer-coverage/check.js --baseline .lint_baselines/transformer_coverage.json
