name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 20
      uses: actions/setup-node@v3
      with:
        node-version: 20.x

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Build
      run: npm run build

    - name: Debug npm config
      run: |
        echo "=== .npmrc contents ==="
        cat .npmrc
        echo ""
        echo "=== npm config list ==="
        npm config list
        echo ""
        echo "=== npm whoami ==="
        npm whoami || echo "Not logged in or token invalid"
      env:
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Publish to npm
      run: npm publish --access public
      env:
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  create-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v3

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
