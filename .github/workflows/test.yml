name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AXONFLOW_TELEMETRY: 'off'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # ADR-065: src/types/authzen.gen.ts is generated from the vendored copy of
      # the platform's canonical AuthZEN surface artifact. It is committed so an
      # `npm install @axonflow/sdk` receives working types AND runtime
      # validators without running a generator - which is only trustworthy if
      # something proves the committed bytes are the output of the committed
      # input. This is that proof, and it fails on BOTH edits: an artifact
      # bumped without regenerating, and a hand edit of the generated module.
      #
      # tests/authzen-generator.test.ts asserts the same property in the test
      # job and asserts that THIS command agrees with it, so the two gates
      # cannot report different answers.
      - name: Check the AuthZEN types are regenerated from the surface artifact
        run: node scripts/gen-authzen-types/generate.js --check

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    # No `needs: lint` — lint and test are independent gates; running them in
    # parallel cuts PR feedback by ~lint-job-duration (~30-60s) at no quality
    # cost. Required-status-check rules treat each as separate.

    strategy:
      # PR runs only Node 20.x (current LTS / release toolchain). Push to
      # main and workflow_dispatch run the full matrix to catch
      # version-specific drift.
      matrix:
        node-version: ${{ fromJson(github.event_name == 'pull_request' && '["20.x"]' || '["18.x", "20.x", "22.x"]') }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == '20.x'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check package
        run: npm pack --dry-run

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
